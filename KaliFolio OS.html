<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Krishna Patil | KaliFolio OS — AI &amp; Software Developer Workstation</title>
<meta name="description" content="Krishna Patil — Software Developer, AI/ML Specialist, and Full-Stack Engineer specializing in Computational Science at G. H. Raisoni. Shark Tank 2025 Winner. Interactive Kali Linux OS simulated workstation.">
<meta name="author" content="Krishna Chandrakant Patil">
<meta property="og:title" content="Krishna Patil | KaliFolio OS — AI Developer Workstation">
<meta property="og:description" content="Engineering intelligent systems. AI · Machine Learning · Full-Stack · MLOps. Raisoni Shark Tank 2025 Winner.">
<meta property="og:image" content="https://avatars.githubusercontent.com/u/179607368?v=4">
<meta property="og:url" content="https://kriss2012.github.io/Portfolio/KaliFolio%20OS.html">
<link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/179607368?v=4">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: full-viewport Kali Linux OS. #intro (boot film) sits above #os (wallpaper, top panel, windows, dock). */
:root{
  --bg:#04060b;--bg2:#0a1120;--panel:rgba(10,16,30,.95);--panel2:#0f1830;--line:#1d2b47;
  --fg:#d6e3f5;--muted:#7f92b0;--accent:#367bf0;--accent2:#5b8df6;--green:#7dff6b;--warn:#ffa646;
  --red:#ff5c6c;--cyan:#4fd8ff;--gold:#e8c547;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none}
*,*::before,*::after{box-sizing:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,textarea,select{font:inherit;color:var(--fg);background:#0a1224;border:1px solid var(--line);border-radius:6px;padding:6px 9px;-webkit-user-select:text;user-select:text}
.btn{background:#13203d;border:1px solid #2a3d63;border-radius:6px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;transition:all .15s ease}
.btn:hover{border-color:var(--accent);color:#fff;background:#1a2b52}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:#4b8bf5;box-shadow:0 0 16px rgba(54,123,240,.4)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#000;font-weight:600}
.btn.gold:hover{background:#f3d25b;box-shadow:0 0 16px rgba(232,197,71,.4)}
.btn.dng:hover{border-color:var(--red);color:var(--red);background:#2d1418}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#243453;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#3b5280}
::-webkit-scrollbar-track{background:transparent}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;background:#000;z-index:1000;overflow:hidden;transition:opacity .8s}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#pc{transition:opacity .7s}
#iterm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(960px,94vw);height:min(78vh,720px);background:#05070a;border:1px solid #1c2c4d;border-radius:10px;box-shadow:0 0 0 1px #000,0 30px 80px #000c,0 0 90px #12326e55;display:flex;flex-direction:column;opacity:0;transition:opacity .7s}
.ititle{padding:9px 14px;background:#0d1526;border-bottom:1px solid #1c2c4d;border-radius:10px 10px 0 0;font:12px var(--mono);color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:#2a3d63}
#ibody{flex:1;margin:0;padding:14px 16px;overflow:hidden;font:13px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;color:#d6e3f5;display:flex;flex-direction:column;justify-content:flex-end}
#ibody>div{white-space:pre-wrap}
#globe{opacity:0;transition:opacity .8s;pointer-events:none}
#skip{position:absolute;right:18px;bottom:18px;z-index:5;background:#0d1526cc;border:1px solid #2a3d63;border-radius:6px;padding:7px 14px;font:12px var(--mono);color:var(--muted);transition:all .15s}
#skip:hover{color:#fff;border-color:var(--accent);background:#13203d}
.caret{display:inline-block;width:8px;height:15px;background:#bfe0ff;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.pb{color:#4a74c9}.pu{color:#4fd8ff;font-weight:700}.pd{color:#ffffff;font-weight:700}
.b{font-weight:700}.d{color:#6b7c99}.r{color:#ff5c6c}.g{color:#7dff6b}.y{color:#ffd45c}.bl{color:#5da2ff}.m{color:#d98cff}.c{color:#4fd8ff}.w{color:#fff}

/* ---------- desktop ---------- */
#os{position:fixed;inset:0;opacity:0;transition:opacity 1s;overflow:hidden}
#os.on{opacity:1}
#wall{position:absolute;inset:0;background:
 radial-gradient(900px 520px at 78% 18%,#12388a66,transparent 70%),
 radial-gradient(700px 500px at 12% 90%,#0b6b8a40,transparent 70%),
 repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 44px),
 repeating-linear-gradient(90deg,#ffffff06 0 1px,transparent 1px 44px),
 linear-gradient(160deg,#050a16,#0a1530 55%,#04070f)}
#wall[data-wp="1"]{background:radial-gradient(800px 600px at 50% 40%,#2d1a66aa,transparent 70%),repeating-linear-gradient(0deg,#ffffff07 0 1px,transparent 1px 36px),linear-gradient(160deg,#07040f,#140b2b)}
#wall[data-wp="2"]{background:radial-gradient(900px 600px at 20% 20%,#0c5d3a88,transparent 70%),repeating-linear-gradient(90deg,#7dff6b0a 0 1px,transparent 1px 40px),linear-gradient(160deg,#030a07,#07160f)}
#wall[data-wp="3"]{background:linear-gradient(135deg,#0a0d14,#1b2233 50%,#0a0d14)}
#wmark{position:absolute;right:28px;bottom:96px;text-align:right;font:700 13px var(--mono);color:#ffffff30;letter-spacing:.14em;pointer-events:none;line-height:1.3}
#wmark b{display:block;font-size:32px;letter-spacing:.06em;color:#ffffff22}
#top{position:absolute;left:0;right:0;top:0;height:36px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px;z-index:9000;backdrop-filter:blur(10px)}
#appsbtn{background:#13203d;border:1px solid #2a3d63;border-radius:6px;padding:4px 11px;font-weight:600;display:flex;gap:7px;align-items:center;white-space:nowrap;font-size:12.5px}
#appsbtn:hover{background:#1b2d54;border-color:var(--accent)}
#tasks{flex:1;display:flex;gap:4px;overflow:hidden;min-width:0}
.task{background:transparent;border:1px solid transparent;border-radius:5px;padding:3px 9px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--muted);transition:all .15s}
.task.act{background:#13203d;border-color:#2a3d63;color:var(--fg)}.task.min{opacity:.55}
.tray{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap}
#clock{color:var(--fg);font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
#userbtn{background:none;border:0;color:var(--fg);padding:3px 8px;border-radius:6px;display:flex;align-items:center;gap:7px;font-weight:500;font-size:12.5px}
#userbtn:hover,.tray button:hover{background:#13203d}
#userbtn img{width:20px;height:20px;border-radius:50%;object-fit:cover;border:1px solid var(--accent)}
#icons{position:absolute;left:14px;top:48px;bottom:90px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:8px;z-index:1}
.dicon{width:86px;padding:8px 3px;border-radius:9px;text-align:center;font-size:12px;cursor:default;border:1px solid transparent;background:none;color:var(--fg);transition:background .15s}
.dicon:hover,.dicon.sel{background:#ffffff14;border-color:#ffffff24}
.dicon .ic{margin:0 auto 5px}.dicon span{display:block;word-break:break-word;text-shadow:0 1px 3px #000;font-weight:500;font-size:11.5px}
.ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font:700 18px var(--mono);color:#fff;box-shadow:inset 0 1px 0 #fff3,0 4px 10px #0007;flex:none}
.ic.sm{width:26px;height:26px;border-radius:7px;font-size:12px}
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;max-width:calc(100% - 20px);display:flex;gap:8px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;z-index:9000;overflow-x:auto;backdrop-filter:blur(10px);box-shadow:0 8px 32px #0009}
.dk{position:relative;background:none;border:0;padding:4px;border-radius:12px;flex:none;transition:transform .12s,background .12s}
.dk:hover{background:#ffffff18;transform:translateY(-3px)}
.dk.run::after{content:"";position:absolute;bottom:-3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.dk .tip{display:none}

/* windows */
#wins{position:absolute;inset:0;z-index:5;pointer-events:none}
.win{position:absolute;pointer-events:auto;background:var(--panel);border:1px solid #2a3d63;border-radius:9px;box-shadow:0 18px 50px #000b,0 0 0 1px #000;display:flex;flex-direction:column;min-width:280px;min-height:170px;overflow:hidden;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.win.foc{border-color:#3d63b3;box-shadow:0 22px 60px #000c,0 0 0 1px #000,0 0 28px #367bf033}
.win.max{left:0!important;top:36px!important;width:100%!important;height:calc(100% - 36px - 74px)!important;border-radius:0}
.win.hid{display:none}
.tb{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(#142243,#0e1830);cursor:default;touch-action:none}
.tb .wt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;font-size:13px}
.wc{display:flex;gap:6px}.wc button{width:20px;height:20px;border-radius:50%;border:0;background:#2a3d63;font-size:11px;line-height:1;display:grid;place-items:center;color:#cfe;transition:background .15s}
.wc button:hover{background:#3d63b3}.wc .x:hover{background:var(--red);color:#fff}
.wb{flex:1;min-height:0;overflow:auto;position:relative;-webkit-user-select:text;user-select:text}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 55%,#4a6aa8 55% 62%,transparent 62% 72%,#4a6aa8 72% 79%,transparent 79%)}
.win.max .rz{display:none}

/* menu, ctx, toast, dialog */
#menu{position:absolute;left:8px;top:40px;width:min(400px,calc(100% - 16px));max-height:calc(100% - 130px);background:var(--panel);border:1px solid #2a3d63;border-radius:12px;box-shadow:0 18px 50px #000c;z-index:9500;display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(12px)}
.menu-head{padding:14px;background:linear-gradient(135deg,#0d1a38,#080f22);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.menu-avatar{width:46px;height:46px;border-radius:50%;border:2px solid var(--accent);object-fit:cover;box-shadow:0 0 12px rgba(54,123,240,.4)}
.menu-head h3{margin:0;font-size:15px;color:#fff;font-weight:600}
.menu-head p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
#menu input{margin:10px;width:calc(100% - 20px);box-sizing:border-box}
#mlist{overflow:auto;padding:0 6px 8px}
.mh{font:700 11px var(--mono);letter-spacing:.1em;color:var(--muted);padding:10px 8px 4px;text-transform:uppercase}
.mi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:6px;transition:background .15s}
.mi:hover{background:#17284b}.mi small{color:var(--muted);display:block;font-size:11px}
.ctx{position:fixed;background:var(--panel);border:1px solid #2a3d63;border-radius:8px;padding:4px;z-index:9800;box-shadow:0 12px 30px #000c;min-width:170px}
.ctx button{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:5px}
.ctx button:hover{background:#17284b}.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#toasts{position:fixed;right:14px;top:46px;display:flex;flex-direction:column;gap:8px;z-index:9900;pointer-events:none}
.toast{background:#13203d;border:1px solid #2a3d63;border-left:3px solid var(--accent);border-radius:6px;padding:9px 13px;box-shadow:0 8px 24px #000a;animation:pop .2s;max-width:320px;font-size:12.5px}
.dlg{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:9950}
.dlg>div{background:var(--panel2);border:1px solid #2a3d63;border-radius:10px;padding:18px;width:min(400px,90vw);display:flex;flex-direction:column;gap:12px}
.dlg .row{display:flex;gap:8px;justify-content:flex-end}

/* terminal */
.term{background:#05080e;font:13px/1.5 var(--mono);padding:10px 12px;box-sizing:border-box;cursor:text;color:#d6e3f5}
.tout{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
.tout .echo{margin-top:2px}
.tline{display:block}.trow{display:flex;align-items:center}
.trow input{flex:1;min-width:0;background:none;border:0;padding:0;font:inherit;color:#fff;outline:none!important;caret-color:#bfe0ff}
.tsym{color:#4a74c9;white-space:pre}

/* apps */
.pad{padding:16px}.col{display:flex;flex-direction:column;gap:12px}.rowf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.mono{font-family:var(--mono)}
.tabs{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;background:#070d1a}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;color:var(--muted);white-space:nowrap;font-size:13px;font-weight:500;transition:all .15s}
.tab.on{color:#fff;border-color:var(--accent);background:rgba(54,123,240,.1)}
.tab:hover{color:#fff}
.app{display:flex;flex-direction:column;height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:#0c152a;border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,transform .2s}
.card:hover{border-color:#367bf066;transform:translateY(-2px)}
.card h4{margin:0;font-size:14.5px;color:#fff;display:flex;align-items:center;justify-content:space-between}
.card p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.55}
.tbl{width:100%;border-collapse:collapse;font:12px var(--mono)}
.tbl th{position:sticky;top:0;background:#0f1a33;text-align:left;font-weight:600;color:var(--muted);padding:6px 8px}
.tbl td{padding:4px 8px;white-space:nowrap;border-bottom:1px solid #121e38}
.tbl tr.sel td{background:#1a3566}
.bar{height:8px;background:#13203d;border-radius:5px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* Hero Section in Portfolio */
.hero{padding:24px 20px;background:radial-gradient(600px 240px at 85% 0%,#367bf044,transparent),linear-gradient(#0d1730,#080e1c);border-bottom:1px solid var(--line);display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero-avatar-wrap{position:relative;width:84px;height:84px;flex-shrink:0}
.hero-avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);box-shadow:0 0 20px rgba(54,123,240,.5)}
.hero-status{position:absolute;bottom:0;right:2px;width:14px;height:14px;border-radius:50%;background:#4ade80;border:2px solid #080e1c}
.hero-text{flex:1;min-width:240px}
.hero h1{margin:0 0 4px;font-size:clamp(22px,4vw,32px);letter-spacing:-.01em;font-weight:700}
.hero .tag{font:12px var(--mono);color:var(--green);display:inline-flex;align-items:center;gap:6px;margin-bottom:6px}
.hero .tag::before{content:"●";font-size:8px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hero .role-line{color:#cfe0f8;font-size:14px;font-weight:500;margin-bottom:4px}
.hero .sub-line{color:var(--muted);font-size:12.5px}
.hero-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hbadge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:11.5px;font-family:var(--mono);background:#13203d;border:1px solid #2a3d63;color:#d6e3f5}
.hbadge.gold{background:rgba(232,197,71,.12);border-color:rgba(232,197,71,.3);color:var(--gold)}

/* Chips, Tags & Badges */
.chip{display:inline-block;padding:2px 8px;border-radius:99px;background:#13203d;border:1px solid #2a3d63;font:11.5px var(--mono);margin:0 4px 4px 0;color:#c0d2ec}
.chip.blue{background:rgba(54,123,240,.15);border-color:rgba(54,123,240,.3);color:var(--cyan)}
.chip.green{background:rgba(125,255,107,.12);border-color:rgba(125,255,107,.25);color:var(--green)}

/* Project Case Study box */
.cs-box{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;background:#080e1c;border-radius:6px;padding:8px}
.cs-cell{font-size:11.5px}
.cs-lbl{font-family:var(--mono);color:var(--cyan);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.cs-val{color:var(--fg);margin-top:2px;line-height:1.4}
.proj-img{width:100%;height:140px;object-fit:cover;border-radius:6px;border:1px solid var(--line);margin-bottom:6px;background:#050913}

/* Skills matrix */
.skill-item{background:#0a1326;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.skill-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12.5px;font-weight:500}
.skill-sub{font-size:11px;color:var(--muted);font-family:var(--mono)}
.skill-prog{height:6px;background:#13203d;border-radius:3px;overflow:hidden}
.skill-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));border-radius:3px}

/* AI Model Playground */
.ai-tester{background:#080e1c;border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.meter-box{background:#0c162e;border:1px solid #1f3358;border-radius:6px;padding:10px}
.meter-val{font-size:20px;font-weight:700;font-family:var(--mono)}

/* Calculator */
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px}
.calc button{padding:14px 0;font:600 17px var(--mono);background:#13203d;border:1px solid #2a3d63;border-radius:8px}
.calc button.op{background:#17306a}.calc button.eq{background:var(--accent)}
.calcd{padding:14px;text-align:right;font:600 28px var(--mono);background:#060a14;min-height:34px;overflow:hidden}

/* File explorer */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:12px;align-content:start}
.fitem{text-align:center;padding:8px 4px;border-radius:8px;border:1px solid transparent;background:none;font-size:12px;word-break:break-word}
.fitem:hover{background:#13203d}.fitem.sel{background:#1a3566;border-color:#3d63b3}
.side{width:140px;flex:none;border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side button{background:none;border:0;text-align:left;padding:6px 8px;border-radius:6px;color:var(--muted);font-size:12.5px}.side button:hover{background:#13203d;color:#fff}

@media(max-width:760px){
  .side{display:none}
  .win.max{height:calc(100% - 36px - 70px)!important}
  #wmark{display:none}
  .tray .hide-s{display:none}
  .dicon{width:72px}
  .cs-box{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="intro">
  <canvas id="pc"></canvas>
  <div id="iterm"><div class="ititle"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span style="margin-left:8px">krishna@kali-workstation: ~/portfolio</span></div><pre id="ibody"></pre></div>
  <canvas id="globe"></canvas>
  <button id="skip">Skip intro &rsaquo;</button>
</div>

<div id="os">
  <div id="wall" data-wp="0"></div>
  <div id="wmark"><b>KRISHNA PATIL</b>KaliFolio OS · AI &amp; Software Workstation</div>
  <div id="icons"></div>
  <div id="wins"></div>
  <div id="top">
    <button id="appsbtn" aria-label="Applications menu">&#9776; Applications</button>
    <div id="tasks"></div>
    <div class="tray">
      <span class="hide-s" title="Virtual Lab Network">&#8644; 10.10.14.2</span>
      <span class="hide-s" title="Battery">&#9646;&#9646;&#9646; 100%</span>
      <span id="clock"></span>

const BOOT=Date.now();
function termApp(win,b,init){
  b.innerHTML='<div class="app term"><pre class="tout"></pre><div class="trow"><span class="tsym"></span><input type="text" autocomplete="off" spellcheck="false"></div></div>';
  const box=b.querySelector('.app'),out=b.querySelector('.tout'),row=b.querySelector('.trow'),sym=b.querySelector('.tsym'),inp=b.querySelector('input');
  const T={cwd:'/home/kali',hist:store.get('hist',[]),root:false,abort:false,env:{USER:'krishna',HOME:'/home/kali',SHELL:'/usr/bin/zsh',TERM:'xterm-256color'},win,
    write(s){out.insertAdjacentHTML('beforeend',ansi(s));box.scrollTop=box.scrollHeight},
    clear(){out.innerHTML='';box.scrollTop=0},
    setPrompt(){const p=T.cwd==='/home/kali'?'~':T.cwd.replace('/home/kali','~');const u=T.root?'root':'krishna';sym.innerHTML=`<span class="pb">┌──(</span><span class="pu">${u}㉖kali</span><span class="pb">)-[</span><span class="pd">${p}</span><span class="pb">]</span>\n<span class="pb">${T.root?'└─# ':'└─$ '}</span>`}
  };
  T.setPrompt();
  let hi=T.hist.length,busy=false;
  const ph=()=>sym.innerHTML;
  inp.onkeydown=async e=>{
    if(e.key==='Enter'){
      if(busy)return;const v=inp.value;inp.value='';
      out.insertAdjacentHTML('beforeend',`<div class="echo">${ph()}${esc(v)}</div>`);
      if(v.trim()){
        if(T.hist[T.hist.length-1]!==v)T.hist.push(v);
        T.hist=T.hist.slice(-100);store.set('hist',T.hist);
      }
      hi=T.hist.length;
      if(v.trim()){
        busy=true;row.style.visibility='hidden';
        try{await execLine(v,T)}catch(x){T.write(`${C.r}${esc(x.message||x)}${C.x}\n`)}
        busy=false;row.style.visibility='';T.setPrompt();
      }
      inp.focus();box.scrollTop=box.scrollHeight;
    }else if(e.key==='ArrowUp'){e.preventDefault();if(hi>0)inp.value=T.hist[--hi]}
    else if(e.key==='ArrowDown'){e.preventDefault();hi=Math.min(hi+1,T.hist.length);inp.value=T.hist[hi]||''}
    else if(e.ctrlKey&&e.key==='c'){T.abort=true;T.write(`${esc(inp.value)}^C\n`);inp.value=''}
    else if(e.ctrlKey&&e.key==='l'){e.preventDefault();T.clear()}
  };
  box.addEventListener('pointerup',()=>inp.focus());
  win.focusHook=()=>setTimeout(()=>inp.focus(),0);
  if(init&&init.cmd)execLine(init.cmd,T).then(()=>T.setPrompt());
  else T.write(`${C.B}Welcome to Krishna Patil's KaliFolio OS${C.x} ${C.d}(zsh)\nType ${C.c}'help'${C.d}, ${C.c}'projects'${C.d}, ${C.c}'skills'${C.d}, or ${C.c}'neofetch'${C.d} to get started.${C.x}\n\n`);
}

 const o=GP.map(p=>{const a=p.th+rot,q=Math.sqrt(1-p.y*p.y);return{p,x:q*Math.cos(a),z:q*Math.sin(a)}}).sort((a,b)=>a.z-b.z);c.textAlign='center';
 for(const e of o){const k=clamp((t-e.p.at)/.6);if(k<=0)continue;const zn=(e.z+1)/2,fs=(9+8*zn)*(.55+.45*grow)*r*Math.min(1.3,Math.min(W,H)/(700*r));c.save();c.translate(cx+e.x*R,cy-e.p.y*R);c.scale(Math.max(.18,Math.abs(e.z)*.85+.15),1);c.globalAlpha=k*(.22+.78*zn);c.fillStyle=e.p.col;c.font=`bold ${fs.toFixed(1)}px JetBrains Mono,monospace`;c.fillText(e.p.txt,0,0);c.restore()}
 c.globalAlpha=clamp((t-4)/1);c.fillStyle='#d6e3f5';c.font=`${13*r}px JetBrains Mono,monospace`;c.fillText('Krishna Patil · AI & ML Developer · G. H. Raisoni',cx,cy+R+34*r);c.globalAlpha=1}

/* ================= boot / power ================= */
function finishIntro(){if(introDone)return;introDone=true;run++;intro.style.opacity=0;setTimeout(()=>{intro.hidden=true},800);bootOS()}
function bootOS(){const os=$('#os');applyAccent();applyWall();renderIcons();renderTasks();tick();requestAnimationFrame(()=>os.classList.add('on'));if(!wins.length)setTimeout(()=>{const w=launch('portfolio');if(w&&!small())w.el.classList.add('max');},400)}
function restartOS(){[...wins].forEach(w=>w.close());$('#menu').hidden=true;runIntro()}
function powerOff(){[...wins].forEach(w=>w.close());$('#os').classList.remove('on');const d=el('div','dlg','<div style="text-align:center;background:#000"><div class="mono muted" style="margin-bottom:12px">KaliFolio OS Workstation Halted.</div><button class="btn pri">Power On Workstation</button></div>');d.style.background='#000';document.body.append(d);d.querySelector('button').onclick=()=>{d.remove();runIntro()}}
$('#skip').onclick=finishIntro;
addEventListener('resize',()=>{wins.forEach(w=>{if(small())w.el.classList.add('max');w.resize&&w.resize()})});
renderDock();
(location.hash==='#skip')?(intro.hidden=true,introDone=true,bootOS()):runIntro();
})();
</script>
