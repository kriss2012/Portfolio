<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>KaliFolio OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: full-viewport OS. #intro (boot film) sits above #os (wallpaper, top panel, windows, dock). Single deliberate dark look. */
:root{--bg:#04060b;--bg2:#0a1120;--panel:rgba(10,16,30,.94);--panel2:#0f1830;--line:#1d2b47;--fg:#d6e3f5;--muted:#7f92b0;--accent:#367bf0;--green:#7dff6b;--warn:#ffa646;--red:#ff5c6c;--cyan:#4fd8ff;
--ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
html,body{height:100%;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,textarea,select{font:inherit;color:var(--fg);background:#0a1224;border:1px solid var(--line);border-radius:6px;padding:6px 9px;-webkit-user-select:text;user-select:text}
.btn{background:#13203d;border:1px solid #2a3d63;border-radius:6px;padding:6px 12px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dng:hover{border-color:var(--red);color:var(--red)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#243453;border-radius:6px}::-webkit-scrollbar-track{background:transparent}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;background:#000;z-index:1000;overflow:hidden;transition:opacity .8s}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#pc{transition:opacity .7s}
#iterm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(940px,94vw);height:min(78vh,720px);background:#05070a;border:1px solid #1c2c4d;border-radius:10px;box-shadow:0 0 0 1px #000,0 30px 80px #000c,0 0 90px #12326e55;display:flex;flex-direction:column;opacity:0;transition:opacity .7s}
.ititle{padding:9px 14px;background:#0d1526;border-bottom:1px solid #1c2c4d;border-radius:10px 10px 0 0;font:12px var(--mono);color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:#2a3d63}
#ibody{flex:1;margin:0;padding:14px 16px;overflow:hidden;font:13px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;color:#d6e3f5;display:flex;flex-direction:column;justify-content:flex-end}
#ibody>div{white-space:pre-wrap}
#globe{opacity:0;transition:opacity .8s;pointer-events:none}
#skip{position:absolute;right:18px;bottom:18px;z-index:5;background:#0d1526cc;border:1px solid #2a3d63;border-radius:6px;padding:7px 14px;font:12px var(--mono);color:var(--muted)}
#skip:hover{color:#fff;border-color:var(--accent)}
.caret{display:inline-block;width:8px;height:15px;background:#bfe0ff;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.pb{color:#4a74c9}.pu{color:#4fd8ff;font-weight:700}.pd{color:#ffffff;font-weight:700}
.b{font-weight:700}.d{color:#6b7c99}.r{color:#ff5c6c}.g{color:#7dff6b}.y{color:#ffd45c}.bl{color:#5da2ff}.m{color:#d98cff}.c{color:#4fd8ff}.w{color:#fff}

/* ---------- desktop ---------- */
#os{position:fixed;inset:0;opacity:0;transition:opacity 1s;overflow:hidden}
#os.on{opacity:1}
#wall{position:absolute;inset:0;background:
 radial-gradient(900px 520px at 78% 18%,#12388a66,transparent 70%),
 radial-gradient(700px 500px at 12% 90%,#0b6b8a40,transparent 70%),
 repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 44px),
 repeating-linear-gradient(90deg,#ffffff06 0 1px,transparent 1px 44px),
 linear-gradient(160deg,#050a16,#0a1530 55%,#04070f)}
#wall[data-wp="1"]{background:radial-gradient(800px 600px at 50% 40%,#2d1a66aa,transparent 70%),repeating-linear-gradient(0deg,#ffffff07 0 1px,transparent 1px 36px),linear-gradient(160deg,#07040f,#140b2b)}
#wall[data-wp="2"]{background:radial-gradient(900px 600px at 20% 20%,#0c5d3a88,transparent 70%),repeating-linear-gradient(90deg,#7dff6b0a 0 1px,transparent 1px 40px),linear-gradient(160deg,#030a07,#07160f)}
#wall[data-wp="3"]{background:linear-gradient(135deg,#0a0d14,#1b2233 50%,#0a0d14)}
#wmark{position:absolute;right:28px;bottom:96px;text-align:right;font:700 13px var(--mono);color:#ffffff30;letter-spacing:.14em;pointer-events:none}
#wmark b{display:block;font-size:34px;letter-spacing:.06em;color:#ffffff22}
#top{position:absolute;left:0;right:0;top:0;height:34px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px;z-index:9000;backdrop-filter:blur(8px)}
#appsbtn{background:#13203d;border:1px solid #2a3d63;border-radius:6px;padding:3px 10px;font-weight:600;display:flex;gap:6px;align-items:center;white-space:nowrap}
#tasks{flex:1;display:flex;gap:4px;overflow:hidden;min-width:0}
.task{background:transparent;border:1px solid transparent;border-radius:5px;padding:3px 9px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--muted)}
.task.act{background:#13203d;border-color:#2a3d63;color:var(--fg)}.task.min{opacity:.55}
.tray{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);white-space:nowrap}
#clock{color:var(--fg);font-variant-numeric:tabular-nums}
#userbtn{background:none;border:0;color:var(--fg);padding:4px 6px;border-radius:5px}
#userbtn:hover,.tray button:hover{background:#13203d}
#icons{position:absolute;left:12px;top:46px;bottom:90px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px;z-index:1}
.dicon{width:84px;padding:6px 2px;border-radius:8px;text-align:center;font-size:12px;cursor:default;border:1px solid transparent;background:none;color:var(--fg)}
.dicon:hover,.dicon.sel{background:#ffffff12;border-color:#ffffff1c}
.dicon .ic{margin:0 auto 4px}.dicon span{display:block;word-break:break-word;text-shadow:0 1px 3px #000}
.ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font:700 18px var(--mono);color:#fff;box-shadow:inset 0 1px 0 #fff3,0 4px 10px #0007;flex:none}
.ic.sm{width:26px;height:26px;border-radius:7px;font-size:12px}
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;max-width:calc(100% - 20px);display:flex;gap:8px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;z-index:9000;overflow-x:auto;backdrop-filter:blur(8px)}
.dk{position:relative;background:none;border:0;padding:3px;border-radius:12px;flex:none}
.dk:hover{background:#ffffff14;transform:translateY(-3px)}.dk{transition:transform .12s}
.dk.run::after{content:"";position:absolute;bottom:-3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--cyan)}
.dk .tip{display:none}
/* windows */
#wins{position:absolute;inset:0;z-index:5;pointer-events:none}
.win{position:absolute;pointer-events:auto;background:var(--panel);border:1px solid #2a3d63;border-radius:9px;box-shadow:0 18px 50px #000b,0 0 0 1px #000;display:flex;flex-direction:column;min-width:260px;min-height:160px;overflow:hidden;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.win.foc{border-color:#3d63b3;box-shadow:0 22px 60px #000c,0 0 0 1px #000,0 0 28px #367bf033}
.win.max{left:0!important;top:34px!important;width:100%!important;height:calc(100% - 34px - 74px)!important;border-radius:0}
.win.hid{display:none}
.tb{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;background:linear-gradient(#142243,#0e1830);cursor:default;touch-action:none}
.tb .wt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;font-size:13px}
.wc{display:flex;gap:6px}.wc button{width:20px;height:20px;border-radius:50%;border:0;background:#2a3d63;font-size:11px;line-height:1;display:grid;place-items:center;color:#cfe}
.wc button:hover{background:#3d63b3}.wc .x:hover{background:var(--red)}
.wb{flex:1;min-height:0;overflow:auto;position:relative;-webkit-user-select:text;user-select:text}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 55%,#4a6aa8 55% 62%,transparent 62% 72%,#4a6aa8 72% 79%,transparent 79%)}
.win.max .rz{display:none}
/* menu, ctx, toast, dialog */
#menu{position:absolute;left:8px;top:38px;width:min(380px,calc(100% - 16px));max-height:calc(100% - 130px);background:var(--panel);border:1px solid #2a3d63;border-radius:10px;box-shadow:0 18px 50px #000c;z-index:9500;display:flex;flex-direction:column;overflow:hidden}
#menu input{margin:10px;width:calc(100% - 20px);box-sizing:border-box}
#mlist{overflow:auto;padding:0 6px 8px}
.mh{font:700 11px var(--mono);letter-spacing:.1em;color:var(--muted);padding:10px 8px 4px;text-transform:uppercase}
.mi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:6px}
.mi:hover{background:#17284b}.mi small{color:var(--muted);display:block}
.ctx{position:fixed;background:var(--panel);border:1px solid #2a3d63;border-radius:8px;padding:4px;z-index:9800;box-shadow:0 12px 30px #000c;min-width:170px}
.ctx button{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:5px}
.ctx button:hover{background:#17284b}.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#toasts{position:fixed;right:12px;top:44px;display:flex;flex-direction:column;gap:8px;z-index:9900;pointer-events:none}
.toast{background:#13203d;border:1px solid #2a3d63;border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px;box-shadow:0 8px 24px #000a;animation:pop .2s;max-width:300px}
.dlg{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:9950}
.dlg>div{background:var(--panel2);border:1px solid #2a3d63;border-radius:10px;padding:18px;width:min(380px,90vw);display:flex;flex-direction:column;gap:12px}
.dlg .row{display:flex;gap:8px;justify-content:flex-end}
/* terminal */
.term{background:#05080e;font:13px/1.5 var(--mono);padding:8px 10px;box-sizing:border-box;cursor:text;color:#d6e3f5}
.tout{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
.tout .echo{margin-top:2px}
.tline{display:block}.trow{display:flex;align-items:center}
.trow input{flex:1;min-width:0;background:none;border:0;padding:0;font:inherit;color:#fff;outline:none!important;caret-color:#bfe0ff}
.tsym{color:#4a74c9;white-space:pre}
/* apps */
.pad{padding:14px}.col{display:flex;flex-direction:column;gap:10px}.rowf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.mono{font-family:var(--mono)}
.tabs{display:flex;gap:4px;padding:8px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:7px 12px;color:var(--muted);white-space:nowrap}
.tab.on{color:#fff;border-color:var(--accent)}
.app{display:flex;flex-direction:column;height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:#0c152a;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:flex-start}
.card h4{margin:0 0 2px;font-size:14px}.card p{margin:0 0 8px;color:var(--muted);font-size:12.5px}
.tbl{width:100%;border-collapse:collapse;font:12px var(--mono)}
.tbl th{position:sticky;top:0;background:#0f1a33;text-align:left;font-weight:600;color:var(--muted);padding:5px 8px}
.tbl td{padding:3px 8px;white-space:nowrap;border-bottom:1px solid #121e38}
.tbl tr.sel td{background:#1a3566}
.bar{height:8px;background:#13203d;border-radius:5px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.hero{padding:26px 22px;background:radial-gradient(500px 220px at 85% 0%,#367bf055,transparent),linear-gradient(#0d1730,#0a1224)}
.hero h1{margin:0;font-size:clamp(26px,5vw,40px);letter-spacing:-.01em}.hero .tag{font:13px var(--mono);color:var(--green);margin-bottom:8px}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;background:#13203d;border:1px solid #2a3d63;font:12px var(--mono);margin:0 6px 6px 0}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px}
.calc button{padding:14px 0;font:600 17px var(--mono);background:#13203d;border:1px solid #2a3d63;border-radius:8px}
.calc button.op{background:#17306a}.calc button.eq{background:var(--accent)}
.calcd{padding:14px;text-align:right;font:600 28px var(--mono);background:#060a14;min-height:34px;overflow:hidden}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;padding:12px;align-content:start}
.fitem{text-align:center;padding:8px 4px;border-radius:8px;border:1px solid transparent;background:none;font-size:12.5px;word-break:break-word}
.fitem:hover{background:#13203d}.fitem.sel{background:#1a3566;border-color:#3d63b3}
.side{width:140px;flex:none;border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side button{background:none;border:0;text-align:left;padding:6px 8px;border-radius:6px;color:var(--muted)}.side button:hover{background:#13203d;color:#fff}
@media(max-width:720px){.side{display:none}.win.max{height:calc(100% - 34px - 70px)!important}#wmark{display:none}.tray .hide-s{display:none}.dicon{width:72px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</div>

<script>
(function(){"use strict";
/* ================= core helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>x*x*(3-2*x);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const store={get(k,d){try{const v=localStorage.getItem('kfos.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('kfos.'+k,JSON.stringify(v))}catch(e){}},clear(){try{Object.keys(localStorage).filter(k=>k.startsWith('kfos.')).forEach(k=>localStorage.removeItem(k))}catch(e){}}};
const C={r:'\x1b[31m',g:'\x1b[32m',y:'\x1b[33m',b:'\x1b[34m',m:'\x1b[35m',c:'\x1b[36m',w:'\x1b[37m',d:'\x1b[90m',B:'\x1b[1m',x:'\x1b[0m'};
const ACLS={1:'b',2:'d',31:'r',32:'g',33:'y',34:'bl',35:'m',36:'c',37:'w',90:'d'};
function ansi(s){let open=false;let o=esc(s).replace(/\x1b\[([0-9;]*)m/g,(m,c)=>{const cl=(c||'0').split(';').map(n=>ACLS[+n]).filter(Boolean);let r=open?'</span>':'';open=false;if(cl.length){r+='<span class="'+cl.join(' ')+'">';open=true}return r});return open?o+'</span>':o}
const stripAnsi=s=>s.replace(/\x1b\[[0-9;]*m/g,'');
const pad=(s,n)=>String(s).padEnd(n);
const fmtDate=d=>d.toLocaleString('en-US',{weekday:'short',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).replace(',','');

/* ================= settings ================= */
const settings=Object.assign({wp:0,accent:'#367bf0',h24:true,installed:[]},store.get('settings',{}));
const saveSettings=()=>store.set('settings',settings);
function applyAccent(){document.documentElement.style.setProperty('--accent',settings.accent)}
function applyWall(){$('#wall').dataset.wp=settings.wp}

/* ================= virtual filesystem ================= */
const D=(c={})=>({t:'d',c}),F=(d='')=>({t:'f',d});
const OWNER={name:'Your Name',role:'Ethical Hacker · Security Engineer · Full-Stack Developer',email:'you@example.com',github:'github.com/your-handle',about:'I break things on purpose, with permission, so they stay fixed. I build secure web apps, run lab environments for practice, and write up what I learn.'};
function defaultFS(){return D({home:D({kali:D({
 Desktop:D({'README.txt':F('Welcome to KaliFolio OS.\n\nThis is a simulated pentest workstation that runs entirely in your browser.\n- Open the Terminal and type: help\n- Install apps with: sudo apt install calculator  (or the Software app)\n- All scanning tools target the built-in lab network only (10.10.14.0/24).\n')}),
 Documents:D({'rules-of-engagement.txt':F('RULES OF ENGAGEMENT (lab)\n1. Test only systems you own or have written permission to test.\n2. Stay inside the agreed scope (see scope.txt).\n3. Log everything. Report findings responsibly.\n4. No denial-of-service, no data exfiltration, no persistence.\n'),'scope.txt':F('In scope:\n  10.10.14.0/24  (portfolio.lab, vuln-lab.lab, gateway.lab)\n  127.0.0.1\nOut of scope:\n  everything else\n'),'notes.md':F('# Pentest notes\n\n- recon -> enumeration -> analysis -> report\n')}),
 Downloads:D(),Pictures:D(),
 Projects:D({'recon-dashboard':D({'README.md':F('# Recon Dashboard\nAsset inventory and port history for the lab network.\n'),'scan.sh':F('#!/bin/sh\nnmap -sV 10.10.14.7\n')}),'hello.txt':F('hello world\n')}),
 '.zshrc':F('alias ll="ls -la"\n')})}),
 etc:D({hostname:F('kali\n'),hosts:F('127.0.0.1 localhost\n10.10.14.7 portfolio.lab\n10.10.14.20 vuln-lab.lab\n10.10.14.1 gateway.lab\n'),'os-release':F('PRETTY_NAME="KaliFolio OS (Kali-inspired simulation)"\nID=kalifolio\nVERSION="2026.4"\n'),passwd:F('root:x:0:0:root:/root:/usr/bin/zsh\nkali:x:1000:1000:Kali,,,:/home/kali:/usr/bin/zsh\n')}),
 var:D({log:D({'auth.log':F('Oct 13 10:02:11 kali sshd[812]: Server listening on 0.0.0.0 port 22.\nOct 13 10:41:07 kali sudo: kali : TTY=pts/0 ; COMMAND=/usr/bin/apt update\n')})}),
 tmp:D(),root:D(),usr:D({bin:D(),share:D({wordlists:D({'common.txt':F('about\nadmin\nbackup\ncontact\nprojects\n.git\nlogin\n')})})})})}
let fs=store.get('fs',null)||defaultFS();
const saveFS=()=>{store.set('fs',fs);window.dispatchEvent(new Event('fschange'))};
function norm(p,cwd){if(!p)return cwd;if(p==='~')p='/home/kali';else if(p.startsWith('~/'))p='/home/kali'+p.slice(1);if(p[0]!=='/')p=cwd+'/'+p;const o=[];for(const s of p.split('/')){if(!s||s==='.')continue;if(s==='..')o.pop();else o.push(s)}return '/'+o.join('/')}
function node(p){let n=fs;for(const s of p.split('/').filter(Boolean)){if(n.t!=='d'||!Object.prototype.hasOwnProperty.call(n.c,s))return null;n=n.c[s]}return n}
function split(p){const a=p.split('/').filter(Boolean);const name=a.pop();return[node('/'+a.join('/')),name]}
